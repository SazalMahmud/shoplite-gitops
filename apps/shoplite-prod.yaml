apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplite-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/SazalMahmud/shoplite-app.git
      targetRevision: main
      path: helm/shoplite
      helm:
        valueFiles:
          - $values/envs/prod/values.yaml
    - repoURL: https://github.com/SazalMahmud/shoplite-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplite-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
